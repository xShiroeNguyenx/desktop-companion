name: Release

# Build Windows + macOS installers and publish a GitHub Release whenever a version tag
# (e.g. v0.1.0) is pushed. Can also be run manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # One universal .dmg for both Intel and Apple Silicon Macs.
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build app + create release
        id: build
        # macOS: bundle_dmg.sh sometimes fails on GitHub runners (hdiutil "Resource busy");
        # let the job go on so the retry step below can build the .dmg once more.
        continue-on-error: ${{ matrix.platform == 'macos-latest' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts and generates latest.json for the updater.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Desktop Companion ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install. The app auto-checks for updates on launch."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Retry macOS build (flaky .dmg bundling)
        if: matrix.platform == 'macos-latest' && steps.build.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Desktop Companion ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install. The app auto-checks for updates on launch."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # --verbose prints bundle_dmg.sh's own output, so a second failure shows the real cause.
          args: ${{ matrix.args }} --verbose
