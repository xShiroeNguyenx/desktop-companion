[package]
name = "desktop-companion"
version = "0.11.3"
edition = "2021"
description = "Standalone Live2D desktop pet"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: cửa sổ trong suốt (pet, widget) trên macOS; đi cùng
# `app.macOSPrivateApi` trong tauri.conf.json. Không ảnh hưởng bản Windows.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

# Self-update: check GitHub Releases, download + install signed updates,
# then relaunch via the process plugin.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# System clipboard read/write for the save/restore selection capture.
arboard = "3"
# Server-side LLM calls (CORS-safe). rustls avoids an OpenSSL/native-tls dep.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Edge TTS: WebSocket (blocking, chạy trên luồng TTS riêng) + chữ ký Sec-MS-GEC.
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
sha2 = "0.10"
# Audio TTS gửi sang webview dạng base64.
base64 = "0.22"
# Gói model Live2D tải riêng (model_pack.rs): zip Stored (không nén, không kéo
# thêm crate nén) và kiểm chữ ký manifest bằng khoá updater. Cùng bản với
# tauri-plugin-updater nên không thêm gì vào lockfile.
zip = { version = "4", default-features = false }
minisign-verify = "0.2"

[dev-dependencies]
# Test chữ ký manifest: sinh khoá lúc chạy, ký, rồi kiểm bằng minisign-verify.
minisign = "0.7"

# Giờ địa phương trên macOS (reminders::local_offset_min): localtime_r + tm_gmtoff.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Win32 access: click-through refresh, the WH_MOUSE_LL global hook, SendInput
# (simulated Ctrl+C), and cursor position.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    # SHQueryUserNotificationState: pet im khi đang trình chiếu / toàn màn hình.
    "Win32_UI_Shell",
    # GetSystemPowerStatus: hiệu ứng thời tiết dừng khi chạy pin (fx.rs).
    "Win32_System_Power",
    # Widget Thông số máy (sysmon_pin.rs): dung lượng ổ đĩa, tốc độ mạng.
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    # Bảng "ngốn máy nhất" (top_procs.rs): danh sách tiến trình, RAM từng tiến trình.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
] }
# WinRT SpeechSynthesizer (giọng có sẵn của Windows, kể cả giọng OneCore).
windows = { version = "0.61", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Core",
    "Media_SpeechSynthesis",
    "Storage_Streams",
] }

# Bản debug (cargo test, npm run dev) không lưu thông tin gỡ lỗi cho thư viện bên
# ngoài, chỉ cho code app: target/debug từng phình tới ~58 GB. Gỡ lỗi code app
# vẫn đủ; backtrace trong thư viện chỉ còn tên hàm, không có số dòng.
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "s"
# Thin LTO trên 16 codegen unit (mặc định của release): đo 2026-10-20, chỉ sửa code
# app thì build 2 phút 52 giây thay vì 7 phút 15 giây với `lto = true` +
# `codegen-units = 1` (fat LTO chạy một luồng trên cả chương trình), exe lớn hơn
# ~1 MB / 50 MB vì phần lớn exe là ảnh, model nhúng vào.
lto = "thin"
strip = true
panic = "abort"
