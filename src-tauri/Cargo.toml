[package]
name = "desktop-companion"
version = "0.7.0"
edition = "2021"
description = "Standalone Live2D desktop pet"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

# Self-update: check GitHub Releases, download + install signed updates,
# then relaunch via the process plugin.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# System clipboard read/write for the save/restore selection capture.
arboard = "3"
# Server-side LLM calls (CORS-safe). rustls avoids an OpenSSL/native-tls dep.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Edge TTS: WebSocket (blocking, chạy trên luồng TTS riêng) + chữ ký Sec-MS-GEC.
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
sha2 = "0.10"
# Audio TTS gửi sang webview dạng base64.
base64 = "0.22"

# Win32 access: click-through refresh, the WH_MOUSE_LL global hook, SendInput
# (simulated Ctrl+C), and cursor position.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    # SHQueryUserNotificationState: pet im khi đang trình chiếu / toàn màn hình.
    "Win32_UI_Shell",
] }
# WinRT SpeechSynthesizer (giọng có sẵn của Windows, kể cả giọng OneCore).
windows = { version = "0.61", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Core",
    "Media_SpeechSynthesis",
    "Storage_Streams",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
