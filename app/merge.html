<!DOCTYPE html>
<!--
  Cửa sổ Ghép Miu (mở từ trang Mini Games). Kiểu 2048 nhưng ghép hình, 13 bậc:
  Miu tím → Miu tuyết → Miu hồng (mỗi màu 2 bậc: ngái ngủ → cổ vũ) → Lolita →
  Kawaii → Pastel → Aristocrat → Angel tím → Angel tuyết → Angel hồng.
  Luật nằm ở js/merge-core.js (có test); giao diện + luồng chơi ở js/game-merge.js.
  Cùng khổ và cách thu nhỏ với game.html / guess.html.
-->
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghép Miu</title>
  <style>
    :root {
      --ink: #5b2f47;
      --ink-soft: #9a6a84;
      --pink: #ff73ab;
      --pink-2: #ff9ec7;
      --line: rgba(255, 150, 190, 0.45);
      --gold: #ffd76a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      user-select: none;
    }
    /* Vẽ theo khổ 900×560 rồi thu về 72% (648×404). ĐỒNG BỘ với GAME_W / GAME_H
       trong windows.rs (dùng chung với Oẳn tù tì và Đoán số). */
    html { zoom: 0.72; }

    .window {
      position: absolute;
      inset: 6px;
      display: flex;
      flex-direction: column;
      border-radius: 22px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.85);
      background:
        radial-gradient(55% 70% at 15% 55%, rgba(255, 214, 233, 0.95), transparent 70%),
        radial-gradient(50% 60% at 85% 85%, rgba(214, 196, 255, 0.85), transparent 70%),
        linear-gradient(160deg, #ffe6f1, #f0dcff 60%, #ffd9ea);
      box-shadow: 0 10px 30px rgba(160, 60, 120, 0.35);
    }
    .head {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px 6px 16px;
      position: relative;
      z-index: 5;
    }
    .head .title {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px;
      border-radius: 14px 14px 14px 4px;
      background: rgba(255, 255, 255, 0.85);
      font-weight: 800;
      font-size: 17px;
    }
    .head .spacer { flex: 1; align-self: stretch; }
    .round-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.75);
      color: var(--ink);
      font: 800 15px/1 "Segoe UI", sans-serif;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .round-btn:hover { background: #fff; }
    .round-btn.close { background: var(--pink); color: #fff; }
    .round-btn.close:hover { background: #f05a97; }
    .round-btn.on { background: var(--pink-2); color: #fff; }

    .stage { position: relative; flex: 1; min-height: 0; }

    /* ─── Nhân vật bên trái ───────────────────────────────────────────────── */
    .hero {
      position: absolute;
      left: 0; bottom: 0;
      width: 236px; height: 300px;
      pointer-events: none;
      z-index: 1;
    }
    .hero .face {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center bottom;
      visibility: hidden;
      filter: drop-shadow(0 8px 18px rgba(200, 80, 140, 0.3));
    }
    .hero .face.on { visibility: visible; }
    .hero .face.swap { animation: swap 0.3s cubic-bezier(.34, 1.56, .64, 1); }
    .hero .face.cheer { animation: cheer 0.6s ease 2; }
    @keyframes swap { from { scale: 0.92; } }
    @keyframes cheer { 30% { translate: 0 -14px; } 60% { translate: 0 0; } }
    .bubble {
      position: absolute;
      left: 14px; top: 4px;
      width: 214px;
      padding: 12px 14px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 14px rgba(200, 80, 140, 0.25);
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      line-height: 1.4;
      z-index: 4;
    }
    .bubble::after { content: '♡'; display: block; color: var(--pink); font-size: 13px; }
    .pop { animation: pop 0.35s cubic-bezier(.34, 1.56, .64, 1); }
    @keyframes pop { from { transform: scale(0.6); opacity: 0; } }

    /* ─── Bàn 4×4 ở giữa ──────────────────────────────────────────────────── */
    .board {
      position: absolute;
      left: 240px; top: 0;
      width: 422px; height: 422px;
      padding: 10px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 8px 22px rgba(200, 80, 140, 0.22);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 8px;
      z-index: 3;
      touch-action: none;
      outline: none;
    }
    .cell {
      position: relative;
      border-radius: 14px;
      background: rgba(255, 190, 220, 0.28);
      overflow: hidden;
    }
    .cell.t { background: #fff; box-shadow: 0 3px 0 rgba(255, 150, 190, 0.45); }
    .cell img {
      position: absolute; inset: 4px 4px 0 4px;
      width: calc(100% - 8px); height: calc(100% - 4px);
      object-fit: contain; object-position: center bottom;
      pointer-events: none;
    }
    /* Ô model: ảnh đại diện vuông, cắt khít ô. */
    .cell.model img { inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .cell .lv {
      position: absolute; left: 4px; top: 4px;
      min-width: 22px; height: 22px; padding: 0 5px;
      border-radius: 11px;
      background: rgba(255, 115, 171, 0.9); color: #fff;
      font: 900 12px/22px "Segoe UI", sans-serif; text-align: center;
    }
    .cell.model { box-shadow: 0 0 0 3px #c9a6ff, 0 3px 0 rgba(150, 110, 220, 0.5); }
    .cell.model .lv { background: linear-gradient(90deg, #8a6cf0, #b48bff); }
    .cell.angel { box-shadow: 0 0 0 3px var(--gold), 0 0 16px rgba(255, 200, 80, 0.8); }
    .cell.angel .lv { background: linear-gradient(90deg, #ffb73a, #ffd76a); color: #7a4a00; }
    .cell.merged { animation: merged 0.25s cubic-bezier(.34, 1.56, .64, 1); }
    .cell.spawned { animation: spawned 0.2s ease-out; }
    @keyframes merged { 50% { transform: scale(1.12); } }
    @keyframes spawned { from { transform: scale(0.3); opacity: 0; } }

    /* ─── Cột phải: điểm, thang tiến hoá, dòng model, nút ─────────────────── */
    .side {
      position: absolute;
      right: 10px; top: 0; bottom: 14px;
      width: 214px;
      padding: 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.72);
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 16px rgba(200, 80, 140, 0.18);
      display: flex; flex-direction: column; gap: 8px;
      z-index: 3;
    }
    .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .score {
      padding: 6px 8px; border-radius: 12px; background: #fff; text-align: center;
    }
    .score small { display: block; font-size: 11.5px; font-weight: 700; color: var(--ink-soft); }
    .score b { font-size: 19px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .side h4 { margin: 2px 0 0; font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .ladder { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .rung {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
      opacity: 0.35;
      filter: grayscale(0.8);
    }
    .rung.got { opacity: 1; filter: none; box-shadow: 0 0 0 2px var(--pink-2); }
    .rung.model.got { box-shadow: 0 0 0 2px #b48bff; }
    .rung.angel.got { box-shadow: 0 0 0 2px var(--gold); }
    .rung img { width: 100%; height: 100%; object-fit: contain; object-position: center bottom; }
    .rung.model img { object-fit: cover; object-position: center top; }
    .next { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); line-height: 1.35; min-height: 34px; }
    .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: rgba(255, 150, 190, 0.14); border-radius: 12px; padding: 3px; }
    .seg button {
      border: none; background: none; border-radius: 9px;
      padding: 6px 4px; font: 700 12.5px "Segoe UI", sans-serif; color: var(--ink); cursor: pointer; white-space: nowrap;
    }
    .seg button.on { background: #fff; color: #e0458f; box-shadow: 0 2px 6px rgba(200, 80, 140, 0.2); }
    .act {
      margin-top: auto;
      height: 44px;
      border: none;
      border-radius: 14px;
      font: 800 15px "Segoe UI", sans-serif;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(180deg, #ff8fc0, #ff5fa2);
      box-shadow: 0 4px 12px rgba(255, 95, 162, 0.35);
    }
    .act:hover { filter: brightness(1.05); }
    .set-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 12.5px; }
    .switch { position: relative; width: 40px; height: 22px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span { position: absolute; inset: 0; border-radius: 11px; background: #e6d3dd; cursor: pointer; transition: background 0.2s; }
    .switch span::before {
      content: ''; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px;
      border-radius: 50%; background: #fff; transition: transform 0.2s;
    }
    .switch input:checked + span { background: var(--pink); }
    .switch input:checked + span::before { transform: translateX(18px); }

    /* ─── "Mở khoá" khi lần đầu ghép ra một model trong ván ───────────────── */
    .unlock {
      position: absolute;
      left: 290px; top: 120px;
      width: 322px;
      padding: 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 12px 28px rgba(150, 90, 220, 0.4);
      display: flex; align-items: center; gap: 12px;
      z-index: 7;
      pointer-events: none;
    }
    .unlock img { width: 84px; height: 84px; border-radius: 14px; object-fit: cover; object-position: center top; box-shadow: 0 0 0 3px #c9a6ff; }
    .unlock small { display: block; font-size: 12.5px; font-weight: 800; color: #8a6cf0; letter-spacing: 0.04em; }
    .unlock b { display: block; font-size: 21px; font-weight: 900; }

    /* ─── Thẻ hết ván / thắng (đè lên bàn) ────────────────────────────────── */
    .result {
      position: absolute;
      left: 240px; top: 0;
      width: 422px; height: 422px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid #fff;
      box-shadow: 0 10px 24px rgba(200, 80, 140, 0.3);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      z-index: 6;
      padding: 18px;
      text-align: center;
    }
    .result img { width: 130px; height: 130px; border-radius: 20px; object-fit: cover; object-position: center top; }
    .result.win img { box-shadow: 0 0 0 4px var(--gold), 0 0 24px rgba(255, 200, 80, 0.8); }
    .result .verdict { font: 900 30px/1.15 "Segoe UI", sans-serif; }
    .result.win .verdict { color: #c98a00; }
    .result .sub { font-size: 14px; font-weight: 600; color: var(--ink-soft); line-height: 1.45; }
    .result .row { display: flex; gap: 10px; margin-top: 6px; }
    .pill {
      border: none;
      border-radius: 14px;
      padding: 10px 22px;
      font: 800 15px "Segoe UI", sans-serif;
      cursor: pointer;
      background: linear-gradient(180deg, #ff8fc0, #ff5fa2);
      color: #fff;
      box-shadow: 0 4px 12px rgba(255, 95, 162, 0.35);
    }
    .pill.ghost { background: rgba(255, 150, 190, 0.18); color: var(--ink); box-shadow: none; }
    .help {
      position: absolute;
      left: 240px; top: 0;
      width: 422px;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.98);
      font-size: 13.5px;
      line-height: 1.5;
      z-index: 8;
      box-shadow: 0 6px 16px rgba(200, 80, 140, 0.25);
    }
    .help p { margin: 0 0 6px; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
  <!-- Giao diện theo bộ nhân vật (js/theme-apply.js đặt body[data-theme]). -->
  <link rel="stylesheet" href="theme-pages.css" />
</head>
<body>
  <div class="window">
    <header class="head" data-tauri-drag-region>
      <div class="title" data-tauri-drag-region>🎮 <span id="titleText">Ghép Miu</span></div>
      <div class="spacer" data-tauri-drag-region></div>
      <button class="round-btn" id="helpBtn" type="button">?</button>
      <button class="round-btn close" id="closeBtn" type="button">×</button>
    </header>
    <main class="stage">
      <div class="hero" id="hero">
        <img class="face on" data-mood="start" src="media/game/rps-wink.png" alt="" draggable="false" decoding="sync" />
        <img class="face" data-mood="happy" src="media/game/rps-cheer.png" alt="" draggable="false" decoding="sync" />
        <img class="face" data-mood="tense" src="media/game/rps-surprised.png" alt="" draggable="false" decoding="sync" />
        <img class="face" data-mood="out" src="media/game/rps-pout.png" alt="" draggable="false" decoding="sync" />
      </div>
      <div class="bubble" id="bubble">…</div>

      <div class="board" id="board" tabindex="0"></div>

      <aside class="side">
        <div class="scores">
          <div class="score"><small id="lblScore"></small><b id="score">0</b></div>
          <div class="score"><small id="lblBest"></small><b id="bestScore">0</b></div>
        </div>
        <h4>✨ <span id="lblLadder"></span></h4>
        <div class="ladder" id="ladder"></div>
        <div class="next" id="nextText"></div>
        <h4>👗 <span id="lblSeries"></span></h4>
        <div class="seg" id="segSeries"></div>
        <div class="set-row"><span id="lblSound"></span><label class="switch"><input type="checkbox" id="optSound" aria-labelledby="lblSound" /><span></span></label></div>
        <button class="act" id="newBtn" type="button"></button>
      </aside>

      <div class="unlock" id="unlock" hidden>
        <img id="unlockImg" src="" alt="" draggable="false" data-miu-fixed />
        <div><small id="unlockLbl"></small><b id="unlockName"></b></div>
      </div>

      <section class="result" id="result" hidden>
        <img id="resImg" src="" alt="" draggable="false" data-miu-fixed />
        <div class="verdict" id="resVerdict"></div>
        <div class="sub" id="resSub"></div>
        <div class="row">
          <button class="pill" id="resMain" type="button"></button>
          <button class="pill ghost" id="resAlt" type="button"></button>
        </div>
      </section>
      <div class="help" id="help" hidden></div>
    </main>
  </div>

  <script src="js/tauri-api.js"></script>
  <script src="js/theme-apply.js"></script>
  <script src="js/miu-skin.js"></script>
  <script src="js/merge-core.js"></script>
  <script src="js/game-merge.js"></script>
</body>
</html>
