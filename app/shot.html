<!DOCTYPE html>
<!--
  📸 Chụp màn hình (shot.rs, PLAN.md 20). Cửa sổ không viền phủ kín màn hình vừa chụp:
  ảnh "đóng băng" làm nền, một canvas phủ vẽ lớp tối + vùng chọn + nét chú thích.
  Hình học: js/shot-core.js. Luồng: js/shot.js.
-->
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chụp màn hình</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
      font-family: "Segoe UI", system-ui, sans-serif; user-select: none;
    }
    #frame, #layer { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    #frame { pointer-events: none; }
    #layer { cursor: crosshair; touch-action: none; }

    #hint {
      position: fixed; left: 50%; top: 18%; transform: translateX(-50%);
      padding: 8px 16px; border-radius: 999px; pointer-events: none;
      background: rgba(20, 20, 28, 0.82); color: #fff; font-size: 14px; white-space: nowrap;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    #toolbar {
      position: fixed; left: 0; top: 0; display: none; align-items: center; gap: 2px;
      padding: 4px; border-radius: 10px;
      background: rgba(28, 28, 38, 0.96); border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); color: #fff;
    }
    #toolbar.show { display: flex; }
    #toolbar button {
      width: 30px; height: 30px; padding: 0; border: 1px solid transparent; border-radius: 7px;
      background: transparent; color: inherit; font-size: 15px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #toolbar button:hover { background: rgba(255, 255, 255, 0.14); }
    #toolbar button.on { background: rgba(255, 115, 171, 0.3); border-color: #ff73ab; }
    #toolbar button:disabled { opacity: 0.4; cursor: default; }
    #toolbar .sep { width: 1px; height: 20px; margin: 0 3px; background: rgba(255, 255, 255, 0.18); }
    #toolbar .swatch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.35); }
    #toolbar .swatch.on { border-color: #fff; box-shadow: 0 0 0 2px #ff73ab; background-clip: padding-box; }
    #toolbar .txt { font-weight: 700; font-family: Georgia, serif; }
    #status {
      position: fixed; left: 0; top: 0; display: none; max-width: 420px;
      padding: 6px 10px; border-radius: 8px; font-size: 12.5px; color: #fff;
      background: rgba(28, 28, 38, 0.96); border: 1px solid rgba(255, 255, 255, 0.16);
    }
    #status.show { display: block; }
    #status.err { background: rgba(120, 28, 36, 0.97); border-color: #ff8f8f; }

    #textIn {
      position: fixed; display: none; min-width: 80px; padding: 0 2px; margin: 0;
      border: 1px dashed rgba(255, 255, 255, 0.8); border-radius: 2px; outline: none;
      background: rgba(0, 0, 0, 0.25); font: 600 18px "Segoe UI", sans-serif; line-height: 1.25;
      user-select: text;
    }
  </style>
</head>
<body>
  <img id="frame" alt="" draggable="false" />
  <canvas id="layer"></canvas>

  <div id="hint" data-i18n="shot.hint">Kéo chuột để khoanh vùng cần chụp · Esc để huỷ</div>

  <div id="toolbar" role="toolbar">
    <button type="button" data-tool="pen" title="Bút vẽ" data-i18n-title="shot.pen">✏️</button>
    <button type="button" data-tool="line" title="Đường thẳng (giữ Shift: ngang / dọc / chéo)" data-i18n-title="shot.line">╱</button>
    <button type="button" data-tool="arrow" title="Mũi tên (giữ Shift: ngang / dọc / chéo)" data-i18n-title="shot.arrow">➡️</button>
    <button type="button" data-tool="rect" title="Khung chữ nhật" data-i18n-title="shot.rect">▭</button>
    <button type="button" data-tool="marker" title="Bút dạ quang" data-i18n-title="shot.marker">🖍️</button>
    <button type="button" data-tool="text" class="txt" title="Chữ" data-i18n-title="shot.text">T</button>
    <span class="sep"></span>
    <span id="colors" style="display:flex; gap:2px;"></span>
    <span class="sep"></span>
    <button type="button" id="undoBtn" title="Hoàn tác (Ctrl+Z)" data-i18n-title="shot.undo">↩️</button>
    <span class="sep"></span>
    <button type="button" id="ocrBtn" title="Dịch chữ trong ảnh" data-i18n-title="shot.ocrTranslate">🌐</button>
    <button type="button" id="textBtn" title="Chép chữ trong ảnh" data-i18n-title="shot.ocrCopy">📄</button>
    <button type="button" id="pinBtn" title="Ghim ảnh lên màn hình" data-i18n-title="shot.pin">📌</button>
    <span class="sep"></span>
    <button type="button" id="copyBtn" title="Chép vào clipboard (Ctrl+C)" data-i18n-title="shot.copy">📋</button>
    <button type="button" id="saveBtn" title="Lưu thành file (Ctrl+S)" data-i18n-title="shot.save">💾</button>
    <button type="button" id="closeBtn" title="Đóng (Esc)" data-i18n-title="shot.close">✕</button>
  </div>
  <div id="status" role="status"></div>

  <input type="text" id="textIn" spellcheck="false" autocomplete="off"
         placeholder="Gõ chữ rồi Enter" data-i18n-placeholder="shot.textPh" />

  <script src="js/tauri-api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/strings/misc.js"></script>
  <script src="js/shot-core.js"></script>
  <script src="js/shot.js"></script>
</body>
</html>
