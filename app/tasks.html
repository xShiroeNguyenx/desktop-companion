<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="ui.css" />
  <title>Công việc</title>
  <style>
    /* Bố cục giống bảng Cài đặt: 2 cột ôm lấy pet ở giữa (Rust dời cửa sổ pet
       vào khe này khi mở — xem windows.rs → dock_pet_to). */
    html, body { height: 100%; overflow: hidden; }
    body {
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      background:
        radial-gradient(120% 90% at 50% 0%, rgba(255, 150, 190, 0.14), transparent 60%),
        var(--bg);
    }

    .tk-head {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 14px 8px;
    }
    .tk-head h2 { font-size: 15px; }

    .tk-grid {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      --pet-gap: clamp(110px, 22%, 170px);
      grid-template-columns: minmax(0, 1fr) var(--pet-gap) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      gap: 0;
      padding: 0 10px 10px;
    }

    /* ─── Cột kính sakura ──────────────────────────────────────────────── */
    .tk-col {
      position: relative;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid rgba(255, 150, 190, 0.32);
      background: linear-gradient(165deg, rgba(255, 183, 213, 0.16), rgba(255, 218, 233, 0.06));
      backdrop-filter: blur(10px);
      box-shadow:
        0 8px 22px rgba(255, 150, 190, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.10);
    }
    /* Mép trong lấn vào khe để pet nép sau lớp kính. */
    .tk-col--todo { grid-column: 1; margin-right: -20px; }
    .tk-col--done { grid-column: 3; margin-left: -20px; }

    @media (max-width: 620px) {
      .tk-grid { --pet-gap: 8px; }
      .tk-col--todo { margin-right: 0; }
      .tk-col--done { margin-left: 0; }
    }

    .tk-col > h3 {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(255, 150, 190, 0.2);
    }
    .tk-count {
      margin-left: auto;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 1px 7px;
    }

    /* Chỉ phần danh sách cuộn, tiêu đề cột đứng yên. */
    .tk-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 150, 190, 0.4) transparent;
    }
    .tk-list::-webkit-scrollbar { width: 6px; }
    .tk-list::-webkit-scrollbar-thumb {
      background: rgba(255, 150, 190, 0.35);
      border-radius: 3px;
    }

    /* ─── Một công việc ────────────────────────────────────────────────── */
    .tk-item {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 8px 9px;
      border-radius: 10px;
      border: 1px solid rgba(255, 150, 190, 0.18);
      background: rgba(255, 255, 255, 0.04);
    }
    .tk-item:hover { border-color: rgba(255, 150, 190, 0.4); }
    .tk-item input[type="checkbox"] {
      flex: 0 0 auto;
      margin-top: 2px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .tk-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .tk-text {
      font-size: 12.5px;
      line-height: 1.35;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .tk-item.done .tk-text { text-decoration: line-through; color: var(--muted); }

    /* Ghi chú: bấm vào là sửa ngay tại chỗ. */
    .tk-note {
      font-size: 11px;
      line-height: 1.35;
      color: #d9b6c6;
      white-space: pre-wrap;
      word-break: break-word;
      cursor: text;
      border-radius: 5px;
      padding: 2px 4px;
      margin: -2px -4px;
    }
    .tk-note:hover { background: rgba(255, 255, 255, 0.05); }
    .tk-note.empty { color: var(--muted); font-style: italic; opacity: 0.65; }
    .tk-note-input {
      width: 100%;
      font: inherit;
      font-size: 11px;
      color: var(--text);
      background: rgba(28, 30, 40, 0.7);
      border: 1px solid rgba(255, 150, 190, 0.45);
      border-radius: 6px;
      padding: 4px 6px;
      resize: vertical;
      min-height: 34px;
    }
    .tk-note-input:focus { outline: none; border-color: rgba(255, 150, 190, 0.8); }

    /* Mốc thời gian: tạo lúc nào, xong lúc nào. */
    .tk-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      font-size: 9.5px;
      color: var(--muted);
    }
    .tk-meta .ok { color: var(--ok); }

    .tk-del {
      flex: 0 0 auto;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 0 2px;
      line-height: 1.4;
    }
    .tk-del:hover { color: var(--danger); }

    /* Ghim lên desktop: mờ khi chưa ghim, sáng + nghiêng khi đang ghim. */
    .tk-pin {
      flex: 0 0 auto;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      padding: 0 2px;
      line-height: 1.5;
      opacity: 0.35;
      filter: grayscale(1);
      transition: opacity 0.15s, transform 0.15s;
    }
    .tk-pin:hover { opacity: 0.8; filter: none; }
    .tk-pin.on { opacity: 1; filter: none; transform: rotate(-20deg); }
    .tk-item:has(.tk-pin.on) { border-color: rgba(255, 150, 190, 0.55); }

    /* Hạn chót: nút 📅 giống nút ghim; nhãn hạn tô theo mức gấp. */
    .tk-cal {
      flex: 0 0 auto;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      padding: 0 2px;
      line-height: 1.5;
      opacity: 0.35;
      filter: grayscale(1);
    }
    .tk-cal:hover, .tk-cal.on { opacity: 0.9; filter: none; }
    .tk-due { cursor: pointer; border-radius: 6px; padding: 0 5px; }
    .tk-due.later { color: var(--muted); background: rgba(255, 255, 255, 0.05); }
    .tk-due.today { color: #ffd166; background: rgba(255, 209, 102, 0.12); }
    .tk-due.soon { color: #ff9f43; background: rgba(255, 159, 67, 0.16); font-weight: 600; }
    .tk-due.over { color: var(--danger); background: rgba(255, 107, 107, 0.14); font-weight: 600; }
    .tk-due-edit { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
    .tk-due-edit input {
      flex: 1 1 150px;
      min-width: 0;
      font: inherit;
      font-size: 11px;
      color: var(--text);
      background: rgba(28, 30, 40, 0.7);
      border: 1px solid rgba(255, 150, 190, 0.45);
      border-radius: 6px;
      padding: 3px 6px;
      color-scheme: dark;
    }
    .tk-due-edit button { font-size: 11px; padding: 3px 9px; }

    /* Link trong nội dung / ghi chú: bấm để mở trình duyệt. */
    .tk-item .lnk {
      color: #8fb4ff;
      text-decoration: underline;
      text-decoration-color: rgba(143, 180, 255, 0.4);
      text-underline-offset: 2px;
      word-break: break-all;
      cursor: pointer;
    }
    .tk-item .lnk:hover { color: #b5ceff; text-decoration-color: currentColor; }
    .tk-item.done .lnk { color: var(--muted); }

    .tk-status { font-size: 11px; color: var(--danger); min-height: 0; }
    .tk-status:empty { display: none; }

    .tk-empty {
      color: var(--muted);
      text-align: center;
      font-size: 11.5px;
      line-height: 1.5;
      padding: 18px 8px;
    }
  </style>
</head>
<body>
  <div class="tk-head">
    <h2>📝 Công việc cần làm</h2>
    <div class="row tight">
      <input type="text" id="newTask" placeholder="Thêm việc mới..." />
      <button class="action" id="addBtn" style="flex: 0 0 auto;">Thêm</button>
    </div>
    <output class="tk-status" id="tkStatus"></output>
  </div>

  <div class="tk-grid">
    <div class="tk-col tk-col--todo">
      <h3>📋 Chưa làm <span class="tk-count" id="todoCount">0</span></h3>
      <div class="tk-list" id="todoList"></div>
    </div>

    <!-- Khe giữa để trống: cửa sổ pet Live2D được Rust dời vào đúng chỗ này. -->

    <div class="tk-col tk-col--done">
      <h3>✅ Đã làm <span class="tk-count" id="doneCount">0</span></h3>
      <div class="tk-list" id="doneList"></div>
    </div>
  </div>

  <script src="js/tauri-api.js"></script>
  <script src="js/due.js"></script>
  <script src="js/linkify.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
