<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="ui.css" />
  <title>Có bản cập nhật mới</title>
  <style>
    body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    .head { display: flex; align-items: center; gap: 10px; }
    .head .spark { font-size: 26px; line-height: 1; }
    .head h1 { margin: 0; font-size: 15px; font-weight: 700; }
    .head .sub { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

    /* Ghi chú phát hành: chừa chỗ nhưng không đẩy dài cửa sổ. */
    .notes {
      flex: 1;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
      min-height: 60px;
    }
    .notes.empty { color: var(--muted); }

    /* Thanh tiến trình chỉ hiện lúc đang tải. */
    #progressWrap { display: none; }
    #progressWrap.show { display: block; }
    .bar {
      height: 6px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #e85f99);
      transition: width .15s ease;
    }
    /* Không biết tổng dung lượng → chạy sọc vô định thay vì đứng yên. */
    .bar.indeterminate > i {
      width: 40%;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }

    .actions { display: flex; gap: 8px; align-items: center; }
    .actions .spacer { flex: 1; }
    button.link {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      padding: 4px 2px;
      text-decoration: underline;
    }
    button.link:hover { color: var(--text); }
    button.link:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <div class="head">
    <div class="spark">✨</div>
    <div>
      <h1 id="title">Có bản mới!</h1>
      <p class="sub" id="versions">Đang kiểm tra...</p>
    </div>
  </div>

  <div class="notes empty" id="notes">(không có ghi chú phát hành)</div>

  <div id="progressWrap">
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="status" id="status"></div>
  </div>
  <div class="status" id="errStatus"></div>

  <div class="actions">
    <button class="link" id="skipBtn" type="button">Bỏ qua bản này</button>
    <div class="spacer"></div>
    <button class="ghost" id="laterBtn" type="button">Để sau</button>
    <button class="action" id="installBtn" type="button">⬇ Tải &amp; cài ngay</button>
  </div>

  <script src="js/tauri-api.js"></script>
  <script src="js/update.js"></script>
</body>
</html>
