<!DOCTYPE html>
<!--
  📌 Ảnh chụp màn hình ghim lên desktop (shot.rs, PLAN.md 20.5). Cửa sổ nhỏ luôn nổi chứa
  đúng một ảnh: kéo để dời, rê chuột vào hiện nút 📋 / ✕, bấm đúp hoặc Esc để gỡ.
  Luồng: js/shot-pin.js.
-->
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ảnh ghim</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #14141c; user-select: none; }
    #pic { width: 100%; height: 100%; display: block; object-fit: contain; cursor: move; }
    /* Viền mảnh để ảnh ghim không lẫn vào cửa sổ phía sau. */
    #edge { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(255, 115, 171, 0.9); }
    #tools { position: fixed; top: 4px; right: 4px; display: flex; gap: 3px; opacity: 0; transition: opacity 0.12s; }
    body:hover #tools { opacity: 1; }
    #tools button {
      width: 24px; height: 24px; padding: 0; border-radius: 6px; cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(20, 20, 28, 0.85); color: #fff;
      font-size: 12px; line-height: 1; display: flex; align-items: center; justify-content: center;
    }
    #tools button:hover { border-color: #ff73ab; }
  </style>
</head>
<body>
  <img id="pic" alt="" draggable="false" />
  <div id="edge"></div>
  <div id="tools">
    <button type="button" id="copyBtn" title="Chép ảnh" data-i18n-title="shotpin.copy">📋</button>
    <button type="button" id="closeBtn" title="Gỡ ghim (Esc hoặc bấm đúp)" data-i18n-title="shotpin.close">✕</button>
  </div>

  <script src="js/tauri-api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/strings/misc.js"></script>
  <script src="js/shot-pin.js"></script>
</body>
</html>
