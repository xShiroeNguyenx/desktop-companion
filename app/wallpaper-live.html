<!DOCTYPE html>
<!--
  🎬 Hình nền động (wallpaper_live.rs → cửa sổ "wallvid"): một video lặp lại phủ kín
  màn hình chính, nằm sau mọi cửa sổ và dưới icon desktop. Video đi qua giao thức
  wallmedia:// (wallpaper.rs: chỉ phát đúng file đã chọn). Luồng: js/wallpaper-live.js.
-->
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hình nền động</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  </style>
</head>
<body>
  <video id="vid" muted loop playsinline autoplay disablepictureinpicture></video>
  <script src="js/tauri-api.js"></script>
  <script src="js/wallpaper-live.js"></script>
</body>
</html>
