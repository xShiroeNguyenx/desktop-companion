<!DOCTYPE html>
<!--
  Widget 🐠 Bể cá ghim trên desktop (aquarium_pin.rs → "pin-aquarium"). Cùng
  kiểu với các widget ghim khác: cửa sổ trong suốt, kéo ở khung, 📍 luôn nổi.
  Cá, cho ăn: Rust (aquarium.rs). Bơi, thức ăn, hình dáng: js/aquarium-core.js.
  Kích thước cửa sổ: aquarium_pin::size (300 × 170, lớn 300 × 280).
-->
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bể cá</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #f6eaf4;
      user-select: none;
    }
    .wrap { position: absolute; inset: 0; padding: 6px; }
    .card {
      /* Màu theo skin (app/skins.css ghi đè qua body[data-skin]); đây là Oải hương. */
      --w-bg-a: rgba(56, 44, 84, 0.72); --w-bg-b: rgba(84, 50, 92, 0.72);
      --w-ink: #f6eaf4; --w-ink-soft: #c9b6d6; --w-accent: #ff73ab; --w-gold: #ffd27a;
      --w-chip: rgba(255, 255, 255, 0.08); --w-line: rgba(255, 255, 255, 0.35);
      --w-shadow: 0 1px 2px rgba(0, 0, 0, 0.45); --w-sky: transparent;
      color: var(--w-ink);
      position: relative;
      height: 100%;
      padding: 7px 8px 8px;
      border-radius: 18px;
      border: 1px solid var(--w-line);
      background: linear-gradient(var(--w-sky), var(--w-sky)), linear-gradient(160deg, var(--w-bg-a), var(--w-bg-b));
      text-shadow: var(--w-shadow);
      box-shadow: 0 6px 14px -6px rgba(20, 10, 40, 0.6);
      cursor: grab;
      animation: drop-in 0.4s cubic-bezier(.2, 1.4, .4, 1) backwards;
      display: flex; flex-direction: column; gap: 5px;
      overflow: hidden;
    }
    @keyframes drop-in { from { opacity: 0; transform: translateY(-10px); } }
    button { font: inherit; color: inherit; }

    .head { display: flex; align-items: baseline; gap: 8px; padding: 0 4px; min-height: 17px; }
    .head .title { font-size: 13px; font-weight: 800; white-space: nowrap; }
    .head .sub { font-size: 10.5px; color: var(--w-ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .head .sub.hungry { color: var(--w-gold); }
    .head .count { margin-left: auto; font-size: 10.5px; font-weight: 700; color: var(--w-ink-soft); }

    /* Lòng bể: canvas phủ kín, viền kính sáng nhẹ. */
    .tank {
      position: relative; flex: 1; min-height: 0;
      border-radius: 12px; overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28), inset 0 8px 14px -10px rgba(255, 255, 255, 0.6);
      cursor: pointer;
    }
    .tank canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .tank .empty {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 11.5px; font-weight: 700; color: rgba(255, 255, 255, 0.85); pointer-events: none;
    }
    .tank .empty[hidden] { display: none; }
    .toast {
      position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
      padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 700;
      background: rgba(40, 30, 60, 0.8); white-space: nowrap; pointer-events: none;
      opacity: 0; transition: opacity 0.3s;
    }
    .toast.on { opacity: 1; }

    .tools {
      position: absolute; right: 14px; bottom: 14px; z-index: 2;
      display: flex; gap: 4px;
      opacity: 0; transition: opacity 0.15s;
    }
    .card:hover .tools { opacity: 1; }
    .tools button {
      width: 24px; height: 24px; border-radius: 8px;
      border: none; background: rgba(40, 30, 60, 0.85); color: #fff;
      font-size: 12px; cursor: pointer;
    }
    .tools button:hover { background: rgba(90, 70, 120, 0.95); }
    .tools button.on { background: var(--w-accent); }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  </style>
  <link rel="stylesheet" href="skins.css" />
  <link rel="stylesheet" href="widget-deco.css" />
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="card" id="card">
      <div class="head">
        <span class="title" id="title"></span>
        <span class="sub" id="fedState"></span>
        <span class="count" id="count"></span>
      </div>
      <div class="tank" id="tank">
        <canvas id="water"></canvas>
        <div class="empty" id="empty" hidden></div>
        <div class="toast" id="toast"></div>
      </div>
      <div class="tools">
        <button id="feedBtn" type="button">🍤</button>
        <button id="manageBtn" type="button">🗂</button>
        <button id="fullBtn" type="button">⛶</button>
        <button id="sizeBtn" type="button">⤢</button>
        <button id="topBtn" type="button">📍</button>
        <button id="unpinBtn" type="button">✕</button>
      </div>
    </div>
  </div>

  <script src="js/tauri-api.js"></script>
  <script src="js/widget-deco.js"></script>
  <script src="js/aquarium-core.js"></script>
  <script src="js/aquarium-draw.js"></script>
  <script src="js/aquarium-pin.js"></script>
</body>
</html>
