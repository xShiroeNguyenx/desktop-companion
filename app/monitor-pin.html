<!DOCTYPE html>
<!--
  Widget 🛰 Theo dõi website ghim trên desktop (monitor_pin.rs → "pin-monitor").
  Cùng kiểu với các widget ghim khác. Kết quả do monitor_net.rs gửi
  ("monitor-stats"); chữ, chấm màu: js/monitor-core.js.
  Kích thước: monitor_pin::height_for (66 + 26 mỗi site, 1–8 dòng).
-->
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Theo dõi website</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #f6eaf4;
      user-select: none;
    }
    .wrap { position: absolute; inset: 0; padding: 6px; }
    .card {
      /* Màu theo skin (app/skins.css ghi đè qua body[data-skin]); đây là Oải hương. */
      --w-bg-a: rgba(56, 44, 84, 0.72); --w-bg-b: rgba(84, 50, 92, 0.72);
      --w-ink: #f6eaf4; --w-ink-soft: #c9b6d6; --w-accent: #ff73ab; --w-gold: #ffd27a;
      --w-chip: rgba(255, 255, 255, 0.08); --w-line: rgba(255, 255, 255, 0.35);
      --w-shadow: 0 1px 2px rgba(0, 0, 0, 0.45); --w-sky: transparent;
      color: var(--w-ink);
      position: relative;
      height: 100%;
      padding: 10px 12px 8px;
      border-radius: 18px;
      border: 1px solid var(--w-line);
      background: linear-gradient(var(--w-sky), var(--w-sky)), linear-gradient(160deg, var(--w-bg-a), var(--w-bg-b));
      text-shadow: var(--w-shadow);
      box-shadow: 0 6px 14px -6px rgba(20, 10, 40, 0.6);
      cursor: grab;
      animation: drop-in 0.4s cubic-bezier(.2, 1.4, .4, 1) backwards;
      display: flex; flex-direction: column; gap: 6px;
      overflow: hidden;
    }
    @keyframes drop-in { from { opacity: 0; transform: translateY(-10px); } }
    button { font: inherit; color: inherit; }

    .head { display: flex; align-items: baseline; gap: 8px; height: 20px; }
    .head .title { font-size: 13px; font-weight: 800; white-space: nowrap; }
    .head .sub { font-size: 10.5px; color: var(--w-ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .head .sub.bad { color: #ff9c9c; font-weight: 700; }

    .list { display: flex; flex-direction: column; }
    .site {
      height: 26px;
      display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 12px; cursor: pointer; border-radius: 6px; padding: 0 4px;
    }
    .site:hover { background: rgba(255, 255, 255, 0.07); }
    .site .n { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .site .v { font-weight: 700; color: var(--w-ink-soft); white-space: nowrap; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); }
    .dot.up { background: #57d48c; box-shadow: 0 0 6px rgba(87, 212, 140, 0.7); }
    .dot.warn { background: var(--w-gold); }
    .dot.down { background: #ff6b6b; box-shadow: 0 0 6px rgba(255, 107, 107, 0.8); animation: blink 1.2s ease-in-out infinite; }
    .site.down .v { color: #ff9c9c; }
    .site.warn .v { color: var(--w-gold); }
    @keyframes blink { 50% { opacity: 0.35; } }
    .empty { font-size: 11.5px; color: var(--w-ink-soft); line-height: 1.4; padding: 2px 4px; }

    .tools {
      position: absolute; right: 8px; top: 8px; z-index: 2;
      display: flex; gap: 4px;
      opacity: 0; transition: opacity 0.15s;
    }
    .card:hover .tools { opacity: 1; }
    .tools button {
      width: 24px; height: 24px; border-radius: 8px;
      border: none; background: rgba(40, 30, 60, 0.85); color: #fff;
      font-size: 12px; cursor: pointer;
    }
    .tools button:hover { background: rgba(90, 70, 120, 0.95); }
    .tools button.on { background: var(--w-accent); }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } .dot.down { animation: none; } }
  </style>
  <link rel="stylesheet" href="skins.css" />
  <link rel="stylesheet" href="widget-deco.css" />
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="card" id="card">
      <div class="head"><span class="title" id="title"></span><span class="sub" id="sum"></span></div>
      <div class="list" id="list"></div>
      <div class="tools">
        <button id="topBtn" type="button">📍</button>
        <button id="unpinBtn" type="button">✕</button>
      </div>
    </div>
  </div>

  <script src="js/tauri-api.js"></script>
  <script src="js/widget-deco.js"></script>
  <script src="js/monitor-core.js"></script>
  <script src="js/monitor-pin.js"></script>
</body>
</html>
