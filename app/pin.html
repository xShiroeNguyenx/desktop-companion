<!DOCTYPE html>
<!--
  Một task được ghim lên desktop (pins.rs). Cửa sổ trong suốt, chỉ có tờ note
  và cây ghim; kích thước cửa sổ được co theo nội dung (pin.js → pin_resize)
  để phần trong suốt thừa không chặn click xuống desktop.
-->
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task ghim</title>
  <style>
    :root {
      --paper-1: #fff0f6;
      --paper-2: #ffd9e8;
      --ink: #5b2f47;
      --ink-soft: #9a6a84;
      --line: rgba(232, 130, 172, 0.22);
      --accent: #ff73ab;
      --ok: #3fbf86;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      user-select: none;
    }

    /* Lề quanh tờ note: chỗ cho cây ghim nhô lên, độ nghiêng và bóng đổ. */
    .wrap {
      position: relative;
      width: 230px;
      padding: 34px 14px 16px;
    }

    .note {
      position: relative;
      padding: 22px 14px 12px;
      border-radius: 4px 4px 10px 4px;
      color: var(--ink);
      background:
        repeating-linear-gradient(to bottom, transparent 0 21px, var(--line) 21px 22px) 0 34px / 100% calc(100% - 46px) no-repeat,
        linear-gradient(160deg, var(--paper-1), var(--paper-2));
      box-shadow:
        0 10px 18px -8px rgba(160, 60, 110, 0.45),
        0 2px 4px rgba(160, 60, 110, 0.18);
      transform: rotate(-2.2deg);
      transform-origin: 50% 0;
      cursor: grab;
      transition: transform 0.25s ease, opacity 0.35s ease;
      animation: drop-in 0.45s cubic-bezier(.2, 1.4, .4, 1) backwards;
    }
    .note:hover { transform: rotate(-1deg); }
    /* Góc gập ở dưới phải, như tờ giấy thật. */
    .note::after {
      content: '';
      position: absolute;
      right: 0;
      bottom: 0;
      width: 18px;
      height: 18px;
      border-radius: 0 0 10px 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0) 50%, rgba(214, 120, 160, 0.35) 50%);
    }
    @keyframes drop-in {
      from { opacity: 0; transform: translateY(-14px) rotate(-6deg); }
      to   { opacity: 1; transform: rotate(-2.2deg); }
    }

    .head {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .head .when { margin-left: auto; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink-soft); }

    .text {
      font-family: "Segoe Print", "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 22px;
      font-weight: 600;
      white-space: pre-wrap;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 8;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .memo {
      margin-top: 4px;
      font-size: 11px;
      line-height: 16px;
      color: var(--ink-soft);
      white-space: pre-wrap;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .memo:empty { display: none; }

    /* Link trong nội dung / ghi chú: bấm để mở trình duyệt. */
    .lnk {
      color: #c2367a;
      text-decoration: underline;
      text-decoration-color: rgba(194, 54, 122, 0.4);
      text-underline-offset: 2px;
      word-break: break-all;
      cursor: pointer;
    }
    .lnk:hover { color: #e0458f; text-decoration-color: currentColor; }

    /* Hạn chót: nhãn nhỏ tô theo mức gấp (due.js → describeDue). */
    .due {
      display: inline-block;
      margin-top: 6px;
      padding: 1px 7px;
      border-radius: 8px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-soft);
      background: rgba(255, 255, 255, 0.55);
    }
    .due:empty { display: none; }
    .due.today { color: #a86b00; background: rgba(255, 209, 102, 0.45); }
    .due.soon { color: #b44d00; background: rgba(255, 159, 67, 0.4); }
    .due.over { color: #fff; background: #e0566f; }

    /* Nút chỉ hiện khi rê chuột, để tờ note trên desktop gọn như giấy thật. */
    .tools {
      display: flex;
      gap: 4px;
      justify-content: flex-end;
      margin-top: 8px;
      height: 22px;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .note:hover .tools, .note:focus-within .tools { opacity: 1; }
    .tools button {
      border: none;
      border-radius: 11px;
      height: 22px;
      min-width: 26px;
      padding: 0 8px;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.7);
      cursor: pointer;
    }
    .tools button:hover { background: #fff; }
    .tools .ok { color: #fff; background: var(--ok); }
    .tools .ok:hover { background: #34a874; }
    .tools .top.on { color: #fff; background: var(--accent); }

    .err {
      margin-top: 6px;
      font-size: 10.5px;
      color: #c43d5c;
    }
    .err:empty { display: none; }

    /* ─── Cây ghim: mặt nhân vật trong một nút ghim tròn ─────────────────── */
    .pin {
      position: absolute;
      top: 4px;
      left: 50%;
      width: 52px;
      height: 52px;
      margin-left: -26px;
      z-index: 2;
      cursor: grab;
      animation: pin-in 0.5s 0.15s cubic-bezier(.2, 1.6, .4, 1) backwards;
    }
    .pin .face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      padding: 3px;
      background: radial-gradient(circle at 35% 30%, #ffc2dc, #ff6fa8 70%, #e04f8c);
      box-shadow:
        0 4px 8px rgba(150, 40, 90, 0.4),
        inset 0 -2px 3px rgba(120, 20, 70, 0.35);
    }
    .pin img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #fff;
      object-fit: cover;
      object-position: 50% 15%;
      background: #ffe6f1;
      pointer-events: none;
    }
    /* Ánh sáng trên mặt ghim. */
    .pin .face::after {
      content: '';
      position: absolute;
      top: 6px;
      left: 10px;
      width: 14px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      transform: rotate(-30deg);
    }
    /* Thân kim cắm xuống tờ giấy. */
    .pin::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 47px;
      width: 3px;
      height: 9px;
      margin-left: -1.5px;
      border-radius: 0 0 2px 2px;
      background: linear-gradient(90deg, #9aa3b5, #eef1f7 45%, #8a93a6);
    }
    @keyframes pin-in {
      from { opacity: 0; transform: translateY(-18px) scale(1.3); }
      to   { opacity: 1; transform: none; }
    }

    /* ─── Xong việc: đóng dấu rồi rơi xuống ──────────────────────────────── */
    .stamp {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
    }
    .stamp span {
      padding: 4px 12px;
      border: 3px solid var(--ok);
      border-radius: 8px;
      color: var(--ok);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.08em;
      transform: rotate(-12deg) scale(2);
      background: rgba(255, 255, 255, 0.75);
    }
    .finished .stamp { opacity: 1; transition: opacity 0.15s; }
    .finished .stamp span { transform: rotate(-12deg) scale(1); transition: transform 0.25s cubic-bezier(.2, 1.6, .4, 1); }
    .finished .note { animation: fall 0.5s 0.45s ease-in forwards; }
    .finished .pin { animation: pop 0.3s 0.4s ease-in forwards; }
    @keyframes fall { to { opacity: 0; transform: translateY(40px) rotate(8deg); } }
    @keyframes pop { to { opacity: 0; transform: translateY(-10px) scale(0.6); } }

    @media (prefers-reduced-motion: reduce) {
      .note, .pin { animation: none; }
      .finished .note, .finished .pin { animation: none; opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="note" id="note">
      <div class="head"><span>📌 Việc cần làm</span><span class="when" id="when"></span></div>
      <div class="text" id="text"></div>
      <div class="memo" id="memo"></div>
      <div class="due" id="due"></div>
      <div class="err" id="err"></div>
      <div class="tools">
        <button class="top" id="topBtn" type="button" title="Luôn nổi trên các cửa sổ khác">📍</button>
        <button id="unpinBtn" type="button" title="Gỡ ghim (task vẫn còn trong danh sách)">✕</button>
        <button class="ok" id="doneBtn" type="button" title="Đánh dấu đã làm xong">✓ Xong</button>
      </div>
      <div class="stamp"><span>XONG!</span></div>
    </div>
    <div class="pin" id="pin" title="Kéo để dời tờ note">
      <div class="face"><img id="avatar" src="/media/character.png" alt="" /></div>
    </div>
  </div>

  <script src="js/tauri-api.js"></script>
  <script src="js/due.js"></script>
  <script src="js/linkify.js"></script>
  <script src="js/pin.js"></script>
</body>
</html>
