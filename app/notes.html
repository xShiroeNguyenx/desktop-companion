<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="ui.css" />
  <title>Ghi chú</title>
  <style>
    /* Một cột kính sakura như bảng Công việc; chỉ danh sách cuộn. */
    html, body { height: 100%; overflow: hidden; }
    body {
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      background:
        radial-gradient(120% 90% at 50% 0%, rgba(255, 150, 190, 0.14), transparent 60%),
        var(--bg);
    }

    .nt-head {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 14px 8px;
    }
    .nt-tabs { display: flex; gap: 6px; }
    .nt-tabs .tab { display: inline-flex; align-items: center; gap: 6px; }
    .nt-tabs .tab.active .nt-count { color: inherit; background: rgba(0, 0, 0, 0.15); }
    .nt-count {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 1px 7px;
    }

    .nt-col {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 0 10px 10px;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid rgba(255, 150, 190, 0.32);
      background: linear-gradient(165deg, rgba(255, 183, 213, 0.16), rgba(255, 218, 233, 0.06));
      backdrop-filter: blur(10px);
      box-shadow:
        0 8px 22px rgba(255, 150, 190, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.10);
    }
    .nt-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 150, 190, 0.4) transparent;
    }
    .nt-list::-webkit-scrollbar { width: 6px; }
    .nt-list::-webkit-scrollbar-thumb {
      background: rgba(255, 150, 190, 0.35);
      border-radius: 3px;
    }

    /* ─── Một ghi chú ──────────────────────────────────────────────────── */
    .nt-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 150, 190, 0.18);
      background: rgba(255, 255, 255, 0.04);
    }
    .nt-item:hover { border-color: rgba(255, 150, 190, 0.4); }
    .nt-item.pinned { border-color: rgba(255, 150, 190, 0.55); }

    .nt-top { display: flex; align-items: flex-start; gap: 6px; }
    .nt-title {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text);
      word-break: break-word;
    }
    .nt-title.untitled { color: var(--muted); font-weight: 600; font-style: italic; }

    .nt-btn {
      flex: 0 0 auto;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      padding: 0 2px;
      line-height: 1.4;
      opacity: 0.55;
      transition: opacity 0.15s, transform 0.15s;
    }
    .nt-btn:hover { opacity: 1; }
    .nt-btn.pin { filter: grayscale(1); opacity: 0.35; }
    .nt-btn.pin:hover { filter: none; opacity: 0.8; }
    .nt-btn.pin.on { filter: none; opacity: 1; transform: rotate(-20deg); }
    .nt-btn.del:hover { color: var(--danger); }
    /* Bấm 🗑 lần đầu chỉ hỏi lại; bấm lần nữa mới xoá. */
    .nt-btn.del.confirm {
      opacity: 1;
      font-size: 11px;
      font-weight: 700;
      color: var(--danger);
      background: rgba(255, 107, 107, 0.14);
      border-radius: 6px;
      padding: 1px 6px;
    }

    /* Nội dung dài thu gọn 8 dòng; bấm vào để mở hết / thu lại. */
    .nt-body {
      font-size: 12px;
      line-height: 1.45;
      color: var(--text);
      opacity: 0.88;
      white-space: pre-wrap;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 8;
      -webkit-box-orient: vertical;
      overflow: hidden;
      cursor: pointer;
    }
    .nt-body.open { display: block; }
    .nt-body:empty { display: none; }

    .nt-meta { font-size: 9.5px; color: var(--muted); }

    .nt-item .lnk {
      color: #8fb4ff;
      text-decoration: underline;
      text-decoration-color: rgba(143, 180, 255, 0.4);
      text-underline-offset: 2px;
      word-break: break-all;
      cursor: pointer;
    }
    .nt-item .lnk:hover { color: #b5ceff; text-decoration-color: currentColor; }

    /* ─── Ô soạn (thêm mới + sửa dùng chung) ───────────────────────────── */
    .nt-editor {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--accent);
      background: rgba(255, 255, 255, 0.04);
    }
    /* Màu ô nhập lấy từ ui.css / theme, chỉ chỉnh cỡ chữ. */
    .nt-editor input { width: 100%; font-size: 13px; font-weight: 600; }
    .nt-editor textarea { width: 100%; font-size: 12px; line-height: 1.45; resize: vertical; min-height: 110px; }
    .nt-editor-bar { display: flex; align-items: center; gap: 6px; }
    .nt-editor-bar .hint { margin-right: auto; font-size: 10px; color: var(--muted); }
    .nt-editor-bar button { font-size: 11.5px; padding: 4px 12px; }

    /* ─── Tab Sự kiện: một dòng mỗi sự kiện, bấm để mở lịch ở ngày đó ───── */
    .nt-item.ev { cursor: pointer; }
    .nt-item.ev.past { opacity: 0.6; }
    .nt-when { font-size: 11px; color: var(--muted); }
    .nt-badge {
      flex: 0 0 auto;
      font-size: 10.5px;
      font-weight: 700;
      border-radius: 8px;
      padding: 1px 7px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.07);
      white-space: nowrap;
    }
    .nt-badge.today { color: #fff; background: var(--accent); }
    .nt-badge.soon { color: #ffd166; background: rgba(255, 209, 102, 0.14); }

    .nt-status { font-size: 11px; color: var(--danger); }
    .nt-status.ok { color: var(--ok); }
    .nt-status:empty { display: none; }

    .nt-empty {
      color: var(--muted);
      text-align: center;
      font-size: 11.5px;
      line-height: 1.6;
      padding: 22px 8px;
    }
  </style>
  <!-- Giao diện theo bộ nhân vật (js/theme-apply.js đặt body[data-theme]). -->
  <link rel="stylesheet" href="theme-snow.css" />
  <link rel="stylesheet" href="theme-gothic.css" />
  <link rel="stylesheet" href="theme-fox.css" />
</head>
<body>
  <!-- Thêm class tk-* để các theme (theme-*.css) tô khung giống bảng Công việc. -->
  <div class="nt-head tk-head">
    <div class="nt-tabs" role="tablist">
      <button class="tab active" type="button" role="tab" data-tab="notes">🗒️ Ghi chú <span class="nt-count" id="ntCount">0</span></button>
      <button class="tab" type="button" role="tab" data-tab="events">🎗 Sự kiện <span class="nt-count" id="evCount">0</span></button>
    </div>
    <div class="row tight">
      <input type="text" id="ntSearch" aria-label="Tìm" placeholder="Tìm trong ghi chú (gõ không dấu cũng được)..." />
      <button class="action" id="ntNew" style="flex: 0 0 auto;">+ Ghi chú mới</button>
    </div>
    <output class="nt-status" id="ntStatus"></output>
  </div>

  <div class="nt-col tk-col">
    <div id="ntComposer"></div>
    <div class="nt-list" id="ntList"></div>
  </div>

  <script src="js/tauri-api.js"></script>
  <script src="js/theme-apply.js"></script>
  <script src="js/linkify.js"></script>
  <script src="js/notes-core.js"></script>
  <script src="js/calendar-core.js"></script>
  <script src="js/notes.js"></script>
</body>
</html>
